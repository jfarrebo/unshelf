<h1>Inicia la sessió</h1>

<form class="form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  @if (error()) {
    <p class="alert" role="alert">{{ error() }}</p>
  }

  <div class="field">
    <label for="email">Correu electrònic</label>
    <input id="email" type="email" formControlName="email" autocomplete="email"
           [attr.aria-invalid]="showError('email')" aria-describedby="email-error" />
    @if (showError('email')) {
      <p id="email-error" class="error">Introdueix un correu electrònic vàlid.</p>
    }
  </div>

  <div class="field">
    <label for="password">Contrasenya</label>
    <input id="password" type="password" formControlName="password" autocomplete="current-password"
           [attr.aria-invalid]="showError('password')" aria-describedby="password-error" />
    @if (showError('password')) {
      <p id="password-error" class="error">Introdueix la contrasenya.</p>
    }
  </div>

  <button class="button" type="submit" [disabled]="loading()">
    {{ loading() ? 'Iniciant la sessió…' : 'Inicia la sessió' }}
  </button>

  <p>No tens compte? <a routerLink="/registre">Registra't</a></p>
</form>
